name = "paul-hub"
main = "src/worker.js"
compatibility_date = "2026-09-01"

# The to-do list lives in a SQLite-backed Durable Object, one per list code, so
# writes are serialised (Workers Free plan supports SQLite Durable Objects).
[[durable_objects.bindings]]
name = "TODO_LIST"
class_name = "TodoList"

# The kitchen, one SQLite Durable Object per kitchen code (src/kitchen-store.js).
[[durable_objects.bindings]]
name = "KITCHEN_STORE"
class_name = "KitchenStore"

# Migrations run once each, in order. Never edit a tag that has been deployed; add a new one.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["TodoList"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["KitchenStore"]

# One KV namespace, "paul-hub" in the dashboard, reached from the Worker as HUB_KV.
# Not used by the to-do. The Morning Screen keeps the calendar push from Odysseus
# (morning:calendar) and its weather, Arsenal and bin cache (cache:<block>) here.
[[kv_namespaces]]
binding = "HUB_KV"
id = "a8b5f676c79f416f9e5ae37b5c589b4a"

# The hub's event log and rules (src/hub.js, migrations/). HUB_KV keeps everything else.
[[d1_databases]]
binding = "HUB_DB"
database_name = "hub"
database_id = "949cfb9d-fe2e-4fe8-8a06-51e6336fcf56"
migrations_dir = "migrations"

# Reactions to typed events. 5 attempts (1 + 4 retries), then the dead letter queue.
[[queues.producers]]
binding = "HUB_QUEUE"
queue = "hub-events"

[[queues.consumers]]
queue = "hub-events"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 4
dead_letter_queue = "hub-events-dlq"

# Secrets, uploaded with `npx wrangler secret bulk <file.json>` (see README), never written here:
#   TODO_CODE            the 16 character list code in Paul's private link
#   TODO_READ_TOKEN      Odysseus, read only, GET /api/todo/open and nothing else
#   ADMIN_TOKEN          full backup, GET /api/admin/todo/export
#   CALENDAR_PUSH_TOKEN  Odysseus, POST /api/morning/calendar and nothing else
#   FIXED_EVENTS         Morning Screen: repeating events and countdowns (JSON)
#   BIN_ADDRESS          Morning Screen: postcode and house number, for bin days
#   BIRTHDAYS            Morning Screen: names and birthdays (JSON)
#   KITCHEN_CODE         the 16 character kitchen code in the Kitchen link (never the same as TODO_CODE)
#   GERMAN_PUSH_TOKEN    the German tutor PC, POST /api/german/week and /api/german/outcome
#   GERMAN_READ_TOKEN    Odysseus, read only, GET /api/german/calls
#   ANTHROPIC_API_KEY    Intake: the Claude API key, POST /api/intake/:code (npx wrangler secret put ANTHROPIC_API_KEY)
#   EVENT_TOKEN          Events: every sender posts to POST /api/event with it (npx wrangler secret put EVENT_TOKEN)
#   HUB_SECRET_DEFENCE_DIGEST  Hub: the defence-digest GitHub Action posts typed events with it
#   HUB_SECRET_DAY       Hub: Day on the Mac posts dinner.away / dinner.back and reads GET /api/hub/config/day
#   INTAKE_PEOPLE       Intake: a few lines saying who mom, dad, lucho, nick, derreck and olivia are (optional)

# Two schedules (src/worker.js). "23 * * * *": heartbeats, backups and the status line, once an hour
# as before. "*/15 * * * *": the Sunday reset, New date wake-ups and the once-only jobs. One list
# like "8,23,38,53" was accepted on deploy but only ever fired at :23 (2026-10-12).
[triggers]
crons = ["23 * * * *", "*/15 * * * *"]
