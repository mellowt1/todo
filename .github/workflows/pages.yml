# Publishes app/ to GitHub Pages on every push to main that touches it.
# Skips quietly until Pages is switched on for this repo (Settings, Pages, Source: GitHub Actions).
name: Pages

on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event.repository.has_pages }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Name the offline cache after the commit, so every publish is a new cache and
      # phones never mix files from two versions, even when nobody bumped it by hand.
      - name: Stamp the service worker cache
        run: |
          sed -i "s/^const CACHE = 'todo-[^']*';/const CACHE = 'todo-${GITHUB_SHA::12}';/" app/sw.js
          grep -q "^const CACHE = 'todo-${GITHUB_SHA::12}';" app/sw.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - id: deployment
        uses: actions/deploy-pages@v4
